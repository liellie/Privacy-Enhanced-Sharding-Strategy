# Four-node local QBFT topology. Host RPC endpoints bind to loopback.

##

##

networks:
  shardnet:
    name: shardnet
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:

  besu-node1:
    image: ${BESU_IMAGE:?Set BESU_IMAGE to a pinned Besu image tag or digest}
    container_name: besu-node1
    networks:
      shardnet:
        ipv4_address: 172.28.0.11
    volumes:
      - ./genesis.json:/config/genesis.json:ro
      - ./static-nodes.json:/config/static-nodes.json:ro
      - ./nodes/node1/data:/data
    ports:
      - "127.0.0.1:8545:8545"
      - "127.0.0.1:8546:8546"
      - "127.0.0.1:9545:9545"
    command:
      - --genesis-file=/config/genesis.json
      - --data-path=/data
      - --node-private-key-file=/data/key
      - --network-id=20260801
      - --p2p-host=172.28.0.11
      - --p2p-port=30303
      - --discovery-enabled=false
      - --static-nodes-file=/config/static-nodes.json
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-cors-origins=*
      - --rpc-http-api=ETH,NET,WEB3,QBFT,ADMIN,TXPOOL,DEBUG
      - --host-allowlist=*
      - --rpc-ws-enabled=true
      - --rpc-ws-host=0.0.0.0
      - --rpc-ws-port=8546
      - --rpc-ws-api=ETH,NET,WEB3,QBFT
      - --metrics-enabled=true
      - --metrics-host=0.0.0.0
      - --metrics-port=9545
      - --min-gas-price=0
      - --logging=INFO
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --post-data '{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}' --header 'Content-Type: application/json' http://localhost:8545 | grep -q result"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  besu-node2:
    image: ${BESU_IMAGE:?Set BESU_IMAGE to a pinned Besu image tag or digest}
    container_name: besu-node2
    networks:
      shardnet:
        ipv4_address: 172.28.0.12
    volumes:
      - ./genesis.json:/config/genesis.json:ro
      - ./static-nodes.json:/config/static-nodes.json:ro
      - ./nodes/node2/data:/data
    ports:
      - "127.0.0.1:8547:8545"
    command:
      - --genesis-file=/config/genesis.json
      - --data-path=/data
      - --node-private-key-file=/data/key
      - --network-id=20260801
      - --p2p-host=172.28.0.12
      - --p2p-port=30303
      - --discovery-enabled=false
      - --static-nodes-file=/config/static-nodes.json
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3,QBFT
      - --host-allowlist=*
      - --min-gas-price=0
      - --logging=INFO
    depends_on:
      - besu-node1
    restart: unless-stopped

  besu-node3:
    image: ${BESU_IMAGE:?Set BESU_IMAGE to a pinned Besu image tag or digest}
    container_name: besu-node3
    networks:
      shardnet:
        ipv4_address: 172.28.0.13
    volumes:
      - ./genesis.json:/config/genesis.json:ro
      - ./static-nodes.json:/config/static-nodes.json:ro
      - ./nodes/node3/data:/data
    ports:
      - "127.0.0.1:8548:8545"
    command:
      - --genesis-file=/config/genesis.json
      - --data-path=/data
      - --node-private-key-file=/data/key
      - --network-id=20260801
      - --p2p-host=172.28.0.13
      - --p2p-port=30303
      - --discovery-enabled=false
      - --static-nodes-file=/config/static-nodes.json
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3,QBFT
      - --host-allowlist=*
      - --min-gas-price=0
      - --logging=INFO
    depends_on:
      - besu-node1
    restart: unless-stopped

  besu-node4:
    image: ${BESU_IMAGE:?Set BESU_IMAGE to a pinned Besu image tag or digest}
    container_name: besu-node4
    networks:
      shardnet:
        ipv4_address: 172.28.0.14
    volumes:
      - ./genesis.json:/config/genesis.json:ro
      - ./static-nodes.json:/config/static-nodes.json:ro
      - ./nodes/node4/data:/data
    ports:
      - "127.0.0.1:8549:8545"
    command:
      - --genesis-file=/config/genesis.json
      - --data-path=/data
      - --node-private-key-file=/data/key
      - --network-id=20260801
      - --p2p-host=172.28.0.14
      - --p2p-port=30303
      - --discovery-enabled=false
      - --static-nodes-file=/config/static-nodes.json
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3,QBFT
      - --host-allowlist=*
      - --min-gas-price=0
      - --logging=INFO
    depends_on:
      - besu-node1
    restart: unless-stopped
